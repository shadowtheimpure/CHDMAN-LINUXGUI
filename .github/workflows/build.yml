name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer
        run: npm run build

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test (real chdman round-trip)
        env:
          ELECTRON_NO_SANDBOX: "1"
        run: xvfb-run -a node scripts/smoke-ui.mjs

  flatpak:
    name: Flatpak bundle
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          npm run build
          npx electron-builder --linux dir

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
          # which bubblewrap/flatpak-builder need.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Build Flatpak
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo flatpak-build \
            flatpak/io.github.shadowtheimpure.CHDMANGUI.yaml
          flatpak build-bundle flatpak-repo \
            "CHDMAN-GUI-${VERSION}-x86_64.flatpak" \
            io.github.shadowtheimpure.CHDMANGUI

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: CHDMAN-GUI-Flatpak
          path: "*.flatpak"
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.flatpak"
          generate_release_notes: true
